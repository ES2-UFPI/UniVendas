name: CI

# Roda em todo PR para a dev (trabalho do dia a dia) ou para a main (release)
# e em todo push nessas duas branches (o merge do PR).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Histórico completo, para o passo abaixo ler os commits do PR.
          fetch-depth: 0
      # Ferramentas de IA não podem aparecer como coautoras (ver CONTRIBUTING).
      - name: Commits sem IA como coautora
        if: github.event_name == 'pull_request'
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          achados=$(git log --format='%h %an <%ae>%n%b' "$base..$head" \
            | grep -iE '^co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|gemini|cursor)|^[0-9a-f]+ .*(noreply@anthropic\.com|claude)' || true)
          if [ -n "$achados" ]; then
            echo "$achados"
            echo "::error::Há commit com IA como autora ou coautora. Veja a seção 'Uso de IA' do CONTRIBUTING.md para corrigir."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
